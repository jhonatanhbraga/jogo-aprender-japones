<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kana no Keiko — Hiragana, Katakana e Frases</title>

<style>
  :root{
    --paper: #efe9d8;
    --paper-card: #faf7ee;
    --ink: #201d16;
    --indigo: #2c3c58;
    --indigo-deep: #17233a;
    --hanko: #a8382c;
    --moss: #4b7355;
    --muted: #7d7462;
    --line: rgba(32,29,22,0.14);
    --radius: 6px;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body{
    background-image:
      radial-gradient(circle at 88% 8%, rgba(44,60,88,0.06), transparent 40%),
      radial-gradient(circle at 6% 92%, rgba(168,56,44,0.05), transparent 38%);
  }
  #app{
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    position: relative;
  }

  /* ---------- flash overlay ---------- */
  #flash{
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 50;
    transition: opacity 90ms ease-out;
  }
  #flash.correct{ background: var(--moss); opacity: 0.28; }
  #flash.wrong{ background: var(--hanko); opacity: 0.30; }
  @media (prefers-reduced-motion: reduce){
    #flash{ transition: none; }
  }

  /* ---------- menu screen ---------- */
  .screen{ width: 100%; max-width: 460px; }
  .enso{
    position: absolute; top: -60px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    border: 14px solid var(--indigo);
    opacity: 0.08;
    transform: rotate(-8deg);
  }
  .menu{ text-align:center; }
  .menu .kanji-title{
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-weight: 700;
    font-size: clamp(48px, 12vw, 72px);
    color: var(--ink);
    line-height: 1;
    margin: 0 0 6px;
  }
  .menu .subtitle{
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 40px;
    letter-spacing: 0.02em;
  }
  .menu-btn{
    display:block;
    width: 100%;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--indigo);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 14px;
    text-align: left;
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: transform 90ms ease, background 90ms ease;
  }
  .menu-btn:hover{ background: #fff; transform: translateX(2px); }
  .menu-btn:focus-visible{ outline: 2px solid var(--indigo); outline-offset: 2px; }
  .menu-btn .jp{
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 22px;
    margin-right: 12px;
  }
  .menu-btn .stat{
    display:block;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
    font-weight: 400;
  }
  .reset-link{
    display:inline-block;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    background:none; border:none; font-family: inherit;
  }
  .reset-link:hover{ color: var(--hanko); }

  /* ---------- game screen ---------- */
  .game{ display:none; text-align:center; }
  .game.active{ display:block; }
  .menu.hidden{ display:none; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 40px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .back-btn{
    background:none; border:none; cursor:pointer;
    font-family: inherit; font-size: 13.5px; color: var(--indigo);
    padding: 6px 0;
    display:flex; align-items:center; gap:6px;
  }
  .back-btn:hover{ color: var(--hanko); }
  .back-btn:focus-visible{ outline: 2px solid var(--indigo); outline-offset: 2px; }
  .stats{ display:flex; gap:14px; }
  .stats b{ color: var(--ink); font-weight: 700; }

  .char-wrap{
    height: clamp(160px, 32vw, 220px);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 44px;
  }
  #kana-char{
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-weight: 700;
    font-size: clamp(110px, 26vw, 170px);
    color: var(--ink);
    line-height: 1;
    user-select: none;
  }

  /* modo frases: caixa mais baixa, texto que quebra linha */
  #game[data-mode="phrases"] .char-wrap{
    height: auto;
    min-height: 130px;
    padding: 10px 6px;
  }
  #game[data-mode="phrases"] #kana-char{
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 600;
    line-height: 1.55;
    white-space: normal;
    max-width: 420px;
  }
  #kana-sub{
    display: none;
    font-size: 15px;
    font-style: italic;
    color: var(--muted);
    margin-top: 10px;
  }
  #game[data-mode="phrases"] #kana-sub{
    display: block;
  }

  .options{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 480px){
    .options{ grid-template-columns: 1fr; }
  }
  #game[data-mode="phrases"] .options{
    grid-template-columns: 1fr;
  }
  .opt{
    position: relative;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 10px 16px;
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: transform 90ms ease, border-color 90ms ease;
  }
  #game[data-mode="phrases"] .opt{
    text-align: left;
    padding: 16px 16px 16px 34px;
    font-size: 15.5px;
    font-weight: 400;
  }
  #game[data-mode="phrases"] .opt .key{
    top: 16px; left: 12px;
  }
  .opt:hover{ transform: translateY(-2px); border-color: var(--indigo); }
  .opt:focus-visible{ outline: 2px solid var(--indigo); outline-offset: 2px; }
  .opt .key{
    position:absolute; top:6px; left:9px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  .hint{
    margin-top: 28px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .footer-note{
    text-align:center;
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
<style>
#kana-char{line-height:1.15;text-align:center;}
#kana-sub{max-width:900px;margin:10px auto 0;text-align:center;line-height:1.45;}
.opt{font-size:clamp(1.4rem,3vw,2.2rem);}
</style>
</head>
<body>
<div id="flash"></div>
<div id="app">
  <div class="screen">
    <div class="enso" aria-hidden="true"></div>

    <!-- MENU -->
    <div class="menu" id="menu">
      <p class="kanji-title">仮名</p>
      <p class="subtitle">Prática de hiragana e katakana — sem kanji</p>

      <button class="menu-btn" data-set="hiragana">
        <span class="jp">あ</span>Hiragana
        <span class="stat" id="stat-hiragana">104 caracteres</span>
      </button>
      <button class="menu-btn" data-set="katakana">
        <span class="jp">ア</span>Katakana
        <span class="stat" id="stat-katakana">104 caracteres</span>
      </button>
      <button class="menu-btn" data-set="phrases">
        <span class="jp">かいわ</span>Frases
        <span class="stat" id="stat-phrases">100 frases do dia a dia</span>
      </button>

      <button class="reset-link" id="reset-btn">reiniciar progresso salvo</button>
    </div>

    <!-- GAME -->
    <div class="game" id="game">
      <div class="topbar">
        <button class="back-btn" id="back-btn">&larr; voltar</button>
        <div class="stats">
          <span>sequência <b id="streak">0</b></span>
          <span>acertos <b id="accuracy">—</b></span>
        </div>
      </div>

      <div class="char-wrap">
        <div id="kana-char">あ</div>
        <div id="kana-sub"></div>
      </div>

      <div class="options" id="options">
        <button class="opt" data-idx="0"><span class="key">1</span><span class="txt"></span></button>
        <button class="opt" data-idx="1"><span class="key">2</span><span class="txt"></span></button>
        <button class="opt" data-idx="2"><span class="key">3</span><span class="txt"></span></button>
      </div>

      <p class="hint">tecle 1, 2 ou 3 — ou use as setas ← ↓ →</p>
      <p class="footer-note">os erros são lembrados: o que você mais erra volta a aparecer com mais frequência</p>
    </div>
  </div>
</div>

    ["わたしはれんしゅうをつづけます。","Watashi wa renshuu o tsuzukemasu.","Eu continuo praticando."],
    ["わたしはかみさまにいのります。","Watashi wa kamisama ni inorimasu.","Eu rezo a Deus."],
    ["わたしはゆめをあきらめません。","Watashi wa yume o akiramemasen.","Eu não desisto dos meus sonhos."]
  ];

  var SETS = { hiragana: HIRAGANA, katakana: KATAKANA, phrases: PHRASES };

  // ---------- persistence ----------
  var STORAGE_KEY = "kana_drill_stats_v1";
  function loadStats(){
    var s;
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) s = JSON.parse(raw);
    }catch(e){}
    s = s || {};
    s.hiragana = s.hiragana || {};
    s.katakana = s.katakana || {};
    s.phrases = s.phrases || {};
    return s;
  }
  function saveStats(stats){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }catch(e){}
  }
  var stats = loadStats();

  // ---------- state ----------
  var currentSetName = null;
  var currentSet = null;
  var currentChar = null;   // [char, romaji]
  var currentOptions = [];  // array of romaji strings
  var correctIdx = 0;
  var lastChar = null;
  var isLocked = false;
  var session = { correct: 0, total: 0, streak: 0 };

  // ---------- elements ----------
  var menuEl = document.getElementById("menu");
  var gameEl = document.getElementById("game");
  var kanaCharEl = document.getElementById("kana-char");
  var kanaSubEl = document.getElementById("kana-sub");
  var optionsEl = document.getElementById("options");
  var optButtons = Array.prototype.slice.call(document.querySelectorAll(".opt"));
  var flashEl = document.getElementById("flash");
  var streakEl = document.getElementById("streak");
  var accuracyEl = document.getElementById("accuracy");

  // ---------- weighted pick ----------
  function weightFor(setName, char){
    var s = stats[setName][char];
    var wrong = s ? s.wrong : 0;
    return 1 + wrong * 2.5;
  }

  function pickChar(setName, set){
    var weights = set.map(function(item){ return weightFor(setName, item[0]); });
    var attempt = 0;
    var pick;
    do{
      var total = weights.reduce(function(a,b){ return a+b; }, 0);
      var r = Math.random() * total;
      var acc = 0;
      pick = set[set.length - 1];
      for(var i=0; i<set.length; i++){
        acc += weights[i];
        if(r <= acc){ pick = set[i]; break; }
      }
      attempt++;
    } while(pick[0] === lastChar && set.length > 1 && attempt < 6);
    return pick;
  }

  // pega a "resposta" de um item: para kana é o romaji (índice 1),
  // para frases é a tradução (último índice, já que o romaji fica no meio)
  function answerOf(item){
  return item[0];
})();
